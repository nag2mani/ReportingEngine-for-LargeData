# ConfigMap - stores non-sensitive application configuration (DB host, Redis, API settings, throttling)
apiVersion: v1
kind: ConfigMap
metadata:
  name: reporting-engine-config
  namespace: reporting-engine
data:
  NODE_ENV: "production"
  PORT: "3000"
  API_PREFIX: "api/v1"
  DB_HOST: "aurora-postgres-cluster.cluster-xxxxx.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_DATABASE: "reporting_engine"
  REDIS_HOST: "reporting-engine-redis.xxxxx.0001.use1.cache.amazonaws.com"
  REDIS_PORT: "6379"
  THROTTLE_TTL: "60"
  THROTTLE_LIMIT: "100"
  JWT_EXPIRES_IN: "1h"
  JWT_REFRESH_EXPIRES_IN: "7d"
