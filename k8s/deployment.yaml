apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-engine
  namespace: reporting-engine
  labels:
    app: reporting-engine
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: reporting-engine
  template:
    metadata:
      labels:
        app: reporting-engine
    spec:
      containers:
      - name: reporting-engine
        image: <ECR_REGISTRY>/reporting-engine:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: PORT
        - name: API_PREFIX
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: API_PREFIX
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: DB_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: reporting-engine-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: reporting-engine-secrets
              key: DB_PASSWORD
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: DB_DATABASE
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: REDIS_PORT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: reporting-engine-secrets
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: reporting-engine-secrets
              key: JWT_REFRESH_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: JWT_EXPIRES_IN
        - name: JWT_REFRESH_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: JWT_REFRESH_EXPIRES_IN
        - name: THROTTLE_TTL
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: THROTTLE_TTL
        - name: THROTTLE_LIMIT
          valueFrom:
            configMapKeyRef:
              name: reporting-engine-config
              key: THROTTLE_LIMIT
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
